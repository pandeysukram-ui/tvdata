function b64ToBlobUrl(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'text/html'});
  return URL.createObjectURL(blob);
}

const frames = {
  fq: document.getElementById('frame-fq'),
  mb: document.getElementById('frame-mb'),
  cc: document.getElementById('frame-cc'),
  cs: document.getElementById('frame-cs'),
  brd: document.getElementById('frame-brd'),
  hm: document.getElementById('frame-hm')
};

let loaded = 0;
Object.keys(frames).forEach(key => {
  frames[key].src = b64ToBlobUrl(B64[key]);
  frames[key].addEventListener('load', () => {
    loaded++;
    if(loaded >= 6) document.getElementById('loading').style.display = 'none';
  }, {once:true});
});

function showTab(name){
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k===name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===name));
  if(typeof twvZoomApply === 'function') twvZoomApply();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// --- shared CSV data bridge: any tool importing a CSV broadcasts it to the other two ---
window.addEventListener('message', (e) => {
  const d = e.data;
  if(!d) return;
  if(d.type === 'twv-csv-broadcast'){
    let sourceKey = null;
    Object.keys(frames).forEach(k => { if(frames[k].contentWindow === e.source) sourceKey = k; });
    const fm = /^([A-Za-z0-9_.-]+)\.csv$/i.exec(d.filename || '');
    if(sourceKey === 'fq' && fm && !/^backup_/i.test(d.filename)){
      const sym = fm[1].toUpperCase();
      if(TWV_BK && TWV_BK.data[sym]){ twvPickScrip(sym); return; }        // scrip is in the JSON backup: load everywhere
      twvSetScripUI(sym);                                                  // CSV-only scrip from FQ: still follow it
      ['mb','cc','cs','hm'].forEach(k => { try{ frames[k].contentWindow.postMessage(d, '*'); }catch(err){} });
      showToast(sym + ' (FQ) → Scorecard, Cycle Chop, Candle Strength, Harmonic');
      return;
    }
    Object.keys(frames).forEach(k => {
      if(k === sourceKey) return;
      try{ frames[k].contentWindow.postMessage(d, '*'); }catch(err){}
    });
    const names = {fq:'FQ Trade', mb:'Scorecard', cc:'Cycle Chop', cs:'Candle Strength', brd:'Market Breadth', hm:'Harmonic'};
    showToast('Synced ' + d.filename + ' from ' + (names[sourceKey]||'a tab') + ' → other tabs');
    return;
  }
  if(d.type === 'twv-share-res'){ twvShareDone(d); return; }
  if(d.type === 'twv-breadth-ready'){ twvSendBreadth(); return; }
  if(d.type === 'twv-pick-request' && d.sym){ twvPickScrip(String(d.sym).toUpperCase()); return; }
  if(d.type === 'twv-switch-tab' && frames[d.tab]){
    showTab(d.tab);
    return;
  }
});

function twvNorm(s){
  s = String(s).toUpperCase().replace('STOCK TRADING OF ','').replace(/[^A-Z0-9 ]/g,' ');

}
function twvDice(a,b){

  A.forEach((c,g)=>{ n+=c; if(B.has(g)) hit+=Math.min(c,B.get(g)); }); B.forEach(c=>n+=c);

  const dTot = {}, dFill = {};

function twvParseCsv(text, fname){

  const H=twvCsvSplit(lines[0],delim).map(h=>h.toUpperCase());
  const ix=(f)=>H.findIndex(f);
  const iS=ix(h=>/SYMBOL|SCRIP|TICKER/.test(h)), iD=ix(h=>/DATE/.test(h)), iO=ix(h=>/OPEN/.test(h)), iH=ix(h=>/HIGH/.test(h)), iL=ix(h=>/LOW/.test(h));

  const base=String(fname||'').replace(/\.[^.]*$/,'').replace(/\s*\(\d+\)\s*$/,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const num=(x)=>{ const n=parseFloat(String(x==null?'':x).replace(/,/g,'')); return isFinite(n)?n:NaN; };
  const out={};
  for(let r=1;r<lines.length;r++){
    const c=twvCsvSplit(lines[r],delim); const sym=((iS>=0?c[iS]:base)||base).toUpperCase().replace(/[^A-Z0-9]/g,''); if(!sym) continue;
    const date=twvCsvDate(c[iD]); const cl=num(c[iC]); if(!date || !isFinite(cl)) continue;
    const o=iO>=0?num(c[iO]):cl, h=iH>=0?num(c[iH]):cl, l=iL>=0?num(c[iL]):cl, v=iV>=0?num(c[iV]):0;
    (out[sym]||(out[sym]=[])).push({date:date, o:isFinite(o)?o:cl, h:isFinite(h)?h:cl, l:isFinite(l)?l:cl, c:cl, v:isFinite(v)?v:0});
  }

}
// merge csv files into what is already on the device, by date (a csv date replaces the same date), then SAVE so it holds
function twvMergeCsv(items){

  try{ frames.hm.contentWindow.postMessage({type:'twv-pick', sym:sym}, '*'); }catch(e){}

  showToast(sym+' → Scorecard, Cycle Chop, Candle Strength');
}

let TWV_SHARE_ID = 0, TWV_SHARE_KEY = 'fq';
// ===== BIG VIEW per tab: A- / A+ changes only the tab you are on (default 125%, remembered per tab) =====
const TWV_ZDEF = 1.25;
let TWV_ZM = {};
try{ TWV_ZM = JSON.parse(localStorage.getItem('twv_zoom_map') || '{}') || {}; }catch(e){ TWV_ZM = {}; }
function twvActiveKey(){ const t = document.querySelector('.tab.active'); return (t && t.dataset.tab) || 'cs'; }
function twvZoomApply(){
  Object.keys(frames).forEach(k => frames[k].style.setProperty('--z', TWV_ZM[k] || TWV_ZDEF));
  const z = TWV_ZM[twvActiveKey()] || TWV_ZDEF;
  document.getElementById('zoomLbl').textContent = Math.round(z * 100) + '%';
}
function twvZoom(dz){
  const k = twvActiveKey(); let z = TWV_ZM[k] || TWV_ZDEF;
  z = dz === 0 ? TWV_ZDEF : Math.round(Math.min(2, Math.max(0.5, z + dz)) * 100) / 100;
  TWV_ZM[k] = z;
  try{ localStorage.setItem('twv_zoom_map', JSON.stringify(TWV_ZM)); }catch(e){}
  twvZoomApply();
}
twvZoomApply();

function twvWmUpdate(){
  const sel = document.getElementById('scripPick'), act = document.querySelector('.tab.active');
  const key = act ? act.dataset.tab : '', sym = sel ? sel.value : '';
  document.getElementById('twvWmSym').textContent = sym;
  document.getElementById('twvWm').style.display = (sym && key !== 'fq' && key !== 'brd') ? 'flex' : 'none';
}
document.getElementById('scripPick').addEventListener('change', twvWmUpdate);
setInterval(twvWmUpdate, 400);
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTimeout(twvWmUpdate, 0)));
function twvShare(){
  const act = document.querySelector('.tab.active'); const key = act ? act.dataset.tab : 'fq';
  TWV_SHARE_KEY = key; const id = ++TWV_SHARE_ID;
  showToast('Capturing ' + key.toUpperCase() + '…');
  try{ frames[key].contentWindow.postMessage({type:'twv-share-req', id:id}, '*'); }catch(e){ showToast('Share failed'); return; }
  setTimeout(() => { if(TWV_SHARE_ID === id && !twvShare._done) showToast('Share timed out — internet check garnus'); }, 20000);
  twvShare._done = false;
}
function twvShareDone(d){
  twvShare._done = true;
  if(d.id !== TWV_SHARE_ID) return;
  if(d.error || !d.png){ showToast('Share failed: ' + (d.error || 'no image')); return; }
  const img = new Image(), logo = new Image();
  let ready = 0;
  const go = () => {
    if(++ready < 2) return;
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    { const sym = document.getElementById('scripPick').value;
      if(sym && TWV_SHARE_KEY !== 'fq' && TWV_SHARE_KEY !== 'brd'){
        x.save(); x.globalAlpha = 0.07; x.fillStyle = '#D4E8FF'; x.textAlign = 'center'; x.textBaseline = 'middle';
        let fs = Math.round(c.height * 0.4); x.font = '700 ' + fs + 'px Chakra Petch, sans-serif';
        const tw = x.measureText(sym).width; if(tw > c.width * 0.8){ fs = Math.floor(fs * c.width * 0.8 / tw); x.font = '700 ' + fs + 'px Chakra Petch, sans-serif'; }
        x.fillText(sym, c.width / 2, c.height / 2); x.restore(); } }
    const sz = Math.max(56, Math.round(c.width * 0.045)), m = Math.round(sz * 0.25);
    x.globalCompositeOperation = 'lighten'; x.globalAlpha = 0.95;
    x.drawImage(logo, m, c.height - sz - m, sz, sz);
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = 0.6; x.fillStyle = '#D4E8FF';
    x.font = Math.round(sz * 0.26) + 'px Share Tech Mono, monospace'; x.textBaseline = 'middle';
    x.fillText('TRADE WITH VIBES', m * 2 + sz, c.height - m - sz / 2);
    c.toBlob(async blob => {
      const name = 'TWV_' + TWV_SHARE_KEY.toUpperCase() + '_' + new Date().toISOString().slice(0,10) + '.png';
      const file = new File([blob], name, {type:'image/png'});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Trade With Vibes'}); return; }
      }catch(e){ if(e && e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      showToast('Saved ' + name);
    }, 'image/png');
  };
  img.onload = go; logo.onload = go; img.src = d.png; logo.src = TWV_LOGO;
}
